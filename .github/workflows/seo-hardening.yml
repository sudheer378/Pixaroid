name: Pixaroid SEO Hardening

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden committed HTML SEO metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path('.').rglob('*.html'))
          changed = []

          for p in files:
              if any(part in {'.git', 'node_modules'} for part in p.parts):
                  continue
              s = p.read_text(encoding='utf-8', errors='ignore')
              original = s

              s = re.sub(r'\s*<meta\s+name=["\']keywords["\'][^>]*>\s*', '\n', s, flags=re.I)

              # Remove only the unsupported rating property from JSON-LD.
              s = re.sub(r',\s*"aggregateRating"\s*:\s*\{\s*"@type"\s*:\s*"AggregateRating"\s*,\s*"ratingValue"\s*:\s*"[^"]+"\s*,\s*"ratingCount"\s*:\s*"[^"]+"\s*,\s*"bestRating"\s*:\s*"[^"]+"\s*\}', '', s, flags=re.I)

              robots = re.compile(r'<meta\s+name=["\']robots["\'][^>]*>', re.I)
              robot_tag = '<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1"/>'
              if robots.search(s):
                  s = robots.sub(robot_tag, s, count=1)

              title = re.search(r'<title>(.*?)</title>', s, re.I | re.S)
              desc = re.search(r'<meta\s+name=["\']description["\'][^>]+content=["\']([^"\']*)["\']', s, re.I)
              if title:
                  t = re.sub(r'\s+', ' ', title.group(1)).strip().replace('"', '&quot;')
                  s = re.sub(r'<meta\s+name=["\']twitter:title["\'][^>]*>', f'<meta name="twitter:title" content="{t}"/>', s, count=1, flags=re.I)
              if desc:
                  d = re.sub(r'\s+', ' ', desc.group(1)).strip().replace('"', '&quot;')
                  s = re.sub(r'<meta\s+name=["\']twitter:description["\'][^>]*>', f'<meta name="twitter:description" content="{d}"/>', s, count=1, flags=re.I)

              if p.as_posix() == 'index.html':
                  s = re.sub(r'\b95\+', '120+', s)
                  s = s.replace('95+ free browser-based image and PDF tools', '120+ free browser-based image and PDF tools')

              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(p.as_posix())

          print(f'Changed {len(changed)} HTML files')
          PY

      - name: Remove Bing-hostile crawl delay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('robots.txt')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n# Crawl-delay .*?\nCrawl-delay: 1\n', '\n', s, flags=re.I | re.S) if 're' in globals() else s
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit SEO hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'seo: harden metadata, canonical signals and crawler rules'
          git push origin main
