name: Check sitemap local files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare sitemap URLs with local files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sitemap = fs.readFileSync('sitemap-tools.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>\s*([^<]+)\s*<\/loc>/g)].map(m => m[1].trim());
          const missing = [];

          for (const url of urls) {
            const pathname = new URL(url).pathname;
            const relative = pathname.endsWith('/') ? `${pathname.slice(1)}index.html` : pathname.slice(1);
            if (!fs.existsSync(path.resolve(relative))) missing.push({ url, file: relative });
          }

          console.log(`Sitemap URLs scanned: ${urls.length}`);
          console.log(`Missing local files: ${missing.length}`);
          for (const item of missing) console.log(`MISSING ${item.url} -> ${item.file}`);
          if (missing.length) process.exitCode = 1;
          NODE
