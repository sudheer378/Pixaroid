/* ═══════════════════════════════════════════════════

:root{
  --ink:#05040D;--ink2:#08071A;--glass:#0D0B1E;--glass2:#131128;--glass3:#1A1833;
  --rim:rgba(255,255,255,.065);--rim2:rgba(255,255,255,.1);--rim3:rgba(255,255,255,.18);
  --txt:#F0EFF8;--mute:#9494BB;--dim:#383860;
  --v:#7B6FFF;--v2:#A99FFF;--vg:rgba(123,111,255,.2);
  --gr:#1EE87A;--tl:#10D4BE;--rs:#FF3C9D;--or:#FF7040;--go:#FFB830;
  --pdf:#F87070;--cmp:#FF7040;--cnv:#7B6FFF;--rsz:#10D4BE;
  --edt:#FFB830;--ai:#FF3C9D;--soc:#1EE87A;--utl:#60A5FA;--blk:#A78BFA;
  --f:'Plus Jakarta Sans',sans-serif;
  --fm:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{font-family:var(--f);background:var(--ink);color:var(--txt);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.6;}

/* Atmospheric bg */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 100% 60% at 50% -15%,rgba(123,111,255,.2),transparent 55%),
    radial-gradient(ellipse 50% 35% at 10% 70%,rgba(255,60,157,.06),transparent 55%),
    radial-gradient(ellipse 40% 30% at 90% 75%,rgba(16,212,190,.05),transparent 50%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.013) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.013) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 80% 50% at 50% 0,black 10%,transparent 75%);}

a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{font-weight:800;line-height:1.1;letter-spacing:-.035em;}
img{display:block;max-width:100%;}
button{cursor:pointer;font-family:var(--f);}
.W{max-width:1200px;margin:0 auto;padding:0 1.25rem;position:relative;z-index:1;}

/* ── NAV ──────────────────────────────────── */
.nav{position:sticky;top:0;z-index:300;background:rgba(5,4,13,.88);backdrop-filter:blur(28px) saturate(160%);border-bottom:1px solid var(--rim);}
.ni{display:flex;align-items:center;gap:.875rem;height:58px;max-width:1200px;margin:0 auto;padding:0 1.25rem;}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.125rem;letter-spacing:-.04em;}
.lm{width:32px;height:32px;border-radius:9px;background:#0A0818;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 20px rgba(123,111,255,.45);}
.logo-t{background:linear-gradient(90deg,#fff 0%,#C4BFFF 45%,#A99FFF 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ns{flex:1;}
.nl{display:flex;align-items:center;gap:.125rem;}
.na{padding:.375rem .75rem;border-radius:8px;font-size:.875rem;font-weight:500;color:var(--mute);transition:color .2s,background .2s;}
.na:hover{color:var(--txt);background:rgba(255,255,255,.06);}
.tbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--rim2);background:var(--glass2);color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s;}
.tbtn:hover{border-color:var(--rim3);}
@media(max-width:768px){.nl{display:none;}}

/* ── HERO ──────────────────────────────────── */
.hero{padding:5rem 0 3.5rem;text-align:center;position:relative;overflow:hidden;}
.hero-glow{position:absolute;width:800px;height:500px;border-radius:50%;background:radial-gradient(ellipse,rgba(123,111,255,.12),transparent 70%);top:-100px;left:50%;transform:translateX(-50%);pointer-events:none;}
.hero-pill{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem .9rem .3rem .5rem;border-radius:999px;border:1px solid rgba(123,111,255,.3);background:rgba(123,111,255,.08);font-size:.8125rem;font-weight:600;color:var(--v2);margin-bottom:1.625rem;animation:fadein .6s ease forwards;}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hero-pill-dot{width:22px;height:22px;border-radius:50%;background:rgba(30,232,122,.15);border:1px solid rgba(30,232,122,.3);display:flex;align-items:center;justify-content:center;}
.hero-pill-dot span{width:7px;height:7px;border-radius:50%;background:var(--gr);display:block;box-shadow:0 0 8px var(--gr);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}
h1.ht{font-size:clamp(2.5rem,7.5vw,5.5rem);font-weight:800;letter-spacing:-.05em;line-height:1.02;margin-bottom:1.375rem;animation:fadein .7s .1s ease both;}
.ht .g1{background:linear-gradient(175deg,#fff 30%,#D4D0FF 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ht .g2{background:linear-gradient(120deg,#A99FFF 0%,#FF3C9D 50%,#FF7040 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hsub{font-size:1.0625rem;color:var(--mute);max-width:600px;margin:0 auto 2.25rem;line-height:1.72;font-weight:400;animation:fadein .7s .2s ease both;}

/* Search */
.sw{max-width:580px;margin:0 auto 1.875rem;display:flex;align-items:center;gap:.75rem;padding:.625rem .625rem .625rem 1.125rem;background:var(--glass);border:1.5px solid var(--rim2);border-radius:16px;box-shadow:0 0 0 0 rgba(123,111,255,.15);transition:border-color .2s,box-shadow .2s;animation:fadein .7s .3s ease both;}
.sw:focus-within{border-color:rgba(123,111,255,.65);box-shadow:0 0 0 4px rgba(123,111,255,.13);}
.sw svg{color:var(--dim);flex-shrink:0;}
#ts{flex:1;background:none;border:none;outline:none;font-size:.9375rem;font-family:var(--f);color:var(--txt);font-weight:500;}
#ts::placeholder{color:var(--dim);}
.kbd{padding:.225rem .5rem;border-radius:6px;border:1px solid var(--rim2);background:var(--glass2);font-size:.7rem;font-family:var(--fm);color:var(--dim);white-space:nowrap;}
.stags{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:2.5rem;animation:fadein .7s .35s ease both;}
.stag{padding:.25rem .75rem;border-radius:999px;border:1px solid var(--rim2);background:var(--glass2);font-size:.8125rem;font-weight:500;color:var(--mute);cursor:pointer;transition:all .18s;}
.stag:hover{border-color:rgba(123,111,255,.4);color:var(--v2);background:rgba(123,111,255,.07);}

/* Stats bar */
.stats{display:flex;gap:0;justify-content:center;border:1px solid var(--rim2);background:var(--glass);border-radius:16px;max-width:560px;margin:0 auto;overflow:hidden;animation:fadein .7s .4s ease both;}
.stat{flex:1;padding:1.25rem .75rem;text-align:center;border-right:1px solid var(--rim);}
.stat:last-child{border-right:none;}
.stat-n{font-size:1.625rem;font-weight:800;letter-spacing:-.04em;background:linear-gradient(135deg,#fff,var(--v2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-l{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:.2rem;}

/* ── TRUST STRIP ───────────────────────────── */
.trust{border-top:1px solid var(--rim);border-bottom:1px solid var(--rim);padding:1rem 0;margin:3rem 0 0;}
.trust-inner{display:flex;align-items:center;justify-content:center;gap:2.5rem;flex-wrap:wrap;max-width:900px;margin:0 auto;}
.trust-item{display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:600;color:var(--mute);}
.trust-item svg{width:16px;height:16px;flex-shrink:0;}
.trust-item .ti-g{color:var(--gr);}
.trust-item .ti-v{color:var(--v2);}
.trust-item .ti-t{color:var(--tl);}

/* ── TABS ──────────────────────────────────── */
.tabs-wrap{position:sticky;top:58px;z-index:200;background:rgba(5,4,13,.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--rim);overflow-x:auto;scrollbar-width:none;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tabs{display:flex;gap:.2rem;padding:.5rem 1.25rem;max-width:1200px;margin:0 auto;width:max-content;min-width:100%;}
.tab{display:flex;align-items:center;gap:.4375rem;padding:.475rem .95rem;border-radius:9px;font-size:.875rem;font-weight:600;color:var(--mute);cursor:pointer;background:none;border:none;white-space:nowrap;transition:color .18s,background .18s;}
.tab:hover{color:var(--txt);background:rgba(255,255,255,.05);}
.tab.on{color:var(--txt);background:rgba(255,255,255,.09);}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tcnt{font-size:.7rem;padding:.1rem .375rem;border-radius:999px;background:rgba(255,255,255,.07);font-weight:700;}

/* ── MAIN CONTENT AREA ─────────────────────── */
.main{padding:1.875rem 0 5rem;}
.rbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.375rem;flex-wrap:wrap;gap:.625rem;}
.rcnt{font-size:.875rem;color:var(--mute);}
.rcnt b{color:var(--txt);font-weight:700;}
.rsrc{font-size:.8125rem;color:var(--dim);}

/* ── SECTIONS ──────────────────────────────── */
.sec{margin-bottom:3.5rem;}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:.875rem;border-bottom:1px solid var(--rim);}
.shl{display:flex;align-items:center;gap:.625rem;}
.shi{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.shi svg{width:15px;height:15px;}
.sht{font-size:1rem;font-weight:800;letter-spacing:-.025em;}
.sha{font-size:.8125rem;color:var(--dim);}
