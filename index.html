<style>
:root{--ink:#05040D;--ink2:#08071A;--glass:#0D0B1E;--glass2:#131128;--glass3:#1A1833;--rim:rgba(255,255,255,.065);--rim2:rgba(255,255,255,.1);--rim3:rgba(255,255,255,.18);--txt:#F0EFF8;--mute:#9494BB;--dim:#383860;--v:#7B6FFF;--v2:#A99FFF;--f:'Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}body{font-family:var(--f);background:var(--ink);color:var(--txt);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.6}a{color:inherit;text-decoration:none}.W{max-width:1200px;margin:0 auto;padding:0 1.25rem;position:relative;z-index:1}.nav{position:sticky;top:0;z-index:300;background:rgba(5,4,13,.88);backdrop-filter:blur(28px) saturate(160%);border-bottom:1px solid var(--rim)}.ni{display:flex;align-items:center;gap:.875rem;height:58px;max-width:1200px;margin:0 auto;padding:0 1.25rem}.logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.125rem;letter-spacing:-.04em}.ns{flex:1}.nl{display:flex;align-items:center;gap:.125rem}.na{padding:.375rem .75rem;border-radius:8px;font-size:.875rem;font-weight:500;color:var(--mute);transition:color .2s,background .2s}.na:hover,.na:focus-visible{color:var(--txt);background:rgba(255,255,255,.06)}.tbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--rim2);background:var(--glass2);color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer}@media(max-width:768px){.nl{display:none}}

</div></nav>

<!-- Existing homepage content is kept in the repository version; this navigation uses only canonical current routes. -->
<div id="app"></div>

<script type="module" src="/js/app.js"></script>
<script>
(function(){
  const root=document.documentElement;
  const btn=document.getElementById('thm');
  const saved=localStorage.getItem('pxr');
  if(saved==='l') root.classList.add('L');
  function sync(){btn.textContent=root.classList.contains('L')?'☀':'☾';}
  btn.addEventListener('click',function(){root.classList.toggle('L');localStorage.setItem('pxr',root.classList.contains('L')?'l':'d');sync();});
  sync();
})();
</script>
