<div class="dz" id="dropzone"><div class="dring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><h3>Select PDF File</h3><p>Drag & drop or <span class="dbr">browse</span></p><input type="file" class="fi" id="fileInput" accept=".pdf,application/pdf"/></div>
<div class="sp" id="settings"><div class="cg"><label class="cl">Compression Level<span class="cv" id="levelVal">Medium</span></label><select id="compressionLevel"><option value="low">Low Quality (150 DPI) - Smaller Size</option><option value="medium" selected>Balanced (120 DPI)</option><option value="high">High Quality (96 DPI)</option><option value="extreme">Maximum Compression (72 DPI)</option></select></div></div>
<div class="pw" id="progressWrap"><div class="pt"><span class="pl" id="progressLabel">Compressing...</span><span class="pd" id="progressPercent">0%</span></div><div class="pb"><div class="pf" id="progressBar"></div></div></div>
<div class="sv" id="savings"><div class="savn" id="savingsPercent">0%</div><div class="svl">Size reduced<br/><span class="svs" id="sizeInfo"></span></div></div>

<script src="/js/pdf/pdf-engine.js"></script><script src="/js/pdf/pdf-utils.js"></script>
<script>
(function(){
'use strict';
let currentFile = null;
let originalSize = 0;
const engine = new PDFEngine();
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const settings = document.getElementById('settings');
const actionBar = document.getElementById('actionBar');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const progressPercent = document.getElementById('progressPercent');
const progressLabel = document.getElementById('progressLabel');
const compressBtn = document.getElementById('compressBtn');
const clearBtn = document.getElementById('clearBtn');
const savings = document.getElementById('savings');
const toast = document.getElementById('toast');
const faqs = [{q:'How does PDF compression work?',a:'Our PDF compressor reduces file size by resampling images to lower DPI (72-150 DPI depending on compression level) and applying JPEG compression. Text remains unchanged.'},{q:'What compression level should I use?',a:'Low (150 DPI) maintains near-original quality. Medium (120 DPI) balances quality and size. High (96 DPI) is good for web. Extreme (72 DPI) maximizes compression.'},{q:'Are my PDFs uploaded to a server?',a:'No — all processing runs in your browser using PDF-lib and PDF.js. Your files never leave your device.'},{q:'How much can I compress a PDF?',a:'Scanned PDFs with images can be compressed 60-80%. Text-heavy PDFs have less compression potential since text is already efficient.'},{q:'Is there a file size limit?',a:'Each PDF can be up to 50MB. Larger files may take longer to process depending on your device.'},{q:'Does compression affect quality?',a:'Yes, but minimally at lower compression levels. Higher compression reduces image quality but keeps text sharp.'}];
document.getElementById('faqContainer').innerHTML = faqs.map((faq,i)=>`<div class="faq-item"><button class="faq-q" onclick="toggleFaq(${i})">${faq.q}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button><div class="faq-a"><div class="faq-a-inner">${faq.a}</div></div></div>`).join('');
window.toggleFaq = i => document.querySelectorAll('.faq-item')[i].classList.toggle('open');
dropzone.addEventListener('click',()=>fileInput.click());
dropzone.addEventListener('dragover',e=>{e.preventDefault();dropzone.style.background='radial-gradient(ellipse 80% 80% at 50% 50%,rgba(124,111,255,.12),transparent)';});
dropzone.addEventListener('dragleave',e=>{e.preventDefault();dropzone.style.background='';});
dropzone.addEventListener('drop',e=>{e.preventDefault();dropzone.style.background='';const files=Array.from(e.dataTransfer.files).filter(f=>f.type==='application/pdf');if(files.length>0)handleFile(files[0]);});
fileInput.addEventListener('change',e=>{if(e.target.files.length>0)handleFile(e.target.files[0]);fileInput.value='';});
function handleFile(file){currentFile=file;originalSize=file.size;settings.classList.add('V');actionBar.classList.add('V');showToast(`${file.name} loaded`,'success');}
compressBtn.addEventListener('click',async()=>{
if(!currentFile)return;
compressBtn.disabled=true;
progressWrap.classList.add('V');
try{
const level=document.getElementById('compressionLevel').value;
const resultBlob=await engine.compress(currentFile,{level,onProgress:p=>{progressBar.style.width=p+'%';progressPercent.textContent=p+'%';}});
progressBar.classList.add('done');
progressLabel.textContent='Complete!';
const newSize=resultBlob.size;
const saved=((originalSize-newSize)/originalSize*100).toFixed(1);
document.getElementById('savingsPercent').textContent=saved+'%';
document.getElementById('sizeInfo').textContent=`${PDFUtils.formatFileSize(originalSize)} → ${PDFUtils.formatFileSize(newSize)}`;
savings.classList.add('V');
PDFUtils.downloadBlob(resultBlob,'compressed.pdf');
showToast('PDF compressed successfully!','success');
}catch(err){console.error(err);showToast('Compression failed','error');}
finally{compressBtn.disabled=false;setTimeout(()=>{progressWrap.classList.remove('V');progressBar.classList.remove('done');progressBar.style.width='0%';},2000);}
});
clearBtn.addEventListener('click',()=>{currentFile=null;originalSize=0;settings.classList.remove('V');actionBar.classList.remove('V');savings.classList.remove('V');progressWrap.classList.remove('V');});
function showToast(msg,type){toastMsg.textContent=msg;toast.className='toast V';setTimeout(()=>toast.classList.remove('V'),3000);}
})();
</script>
