<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - Length, Weight, Temperature & More | Pixaroid</title>
    <meta name="description" content="Free online unit converter for length, weight, temperature, volume, area, and more. Convert between metric and imperial units instantly.">
    <meta name="keywords" content="unit converter, measurement converter, metric to imperial, conversion tool, pixaroid">
    <link rel="canonical" href="https://pixaroid.vercel.app/tools/international/unit-converter.html">
    <meta property="og:title" content="Unit Converter - Convert Any Measurement">
    <meta property="og:description" content="Free online unit converter for length, weight, temperature, volume, and more.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pixaroid.vercel.app/tools/international/unit-converter.html">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .converter-container { max-width: 800px; margin: 40px auto; padding: 30px; background: #1e1e2f; border-radius: 12px; }
        h1 { color: #00d4ff; text-align: center; margin-bottom: 30px; }
        .category-tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        .tab-btn { padding: 10px 20px; background: #2a2a3e; border: none; color: #fff; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: #00d4ff; }
        .conversion-box { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
        .input-group { flex: 1; min-width: 200px; }
        .input-group label { display: block; color: #aaa; margin-bottom: 8px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; background: #2a2a3e; border: 1px solid #3a3a5a; color: #fff; border-radius: 6px; }
        .equals { font-size: 2rem; color: #00d4ff; }
        .result-box { background: #2a2a3e; padding: 20px; border-radius: 8px; text-align: center; margin-top: 20px; }
        .result-value { font-size: 2rem; color: #00d4ff; font-weight: bold; }
    </style>
</head>
<body>
    <header class="site-header"><nav class="navbar"><div class="container nav-container"><a href="/" class="logo">Pixaroid</a><ul class="nav-menu"><li><a href="/">Home</a></li><li><a href="/tools/">All Tools</a></li></ul></div></nav></header>
    <main class="container">
        <div class="converter-container">
            <h1>🔄 Unit Converter</h1>
            <div class="category-tabs">
                <button class="tab-btn active" onclick="setCategory('length')">Length</button>
                <button class="tab-btn" onclick="setCategory('weight')">Weight</button>
                <button class="tab-btn" onclick="setCategory('temperature')">Temperature</button>
                <button class="tab-btn" onclick="setCategory('volume')">Volume</button>
                <button class="tab-btn" onclick="setCategory('area')">Area</button>
            </div>
            <div class="conversion-box">
                <div class="input-group"><label>From</label><input type="number" id="fromValue" value="1" oninput="convert()"><select id="fromUnit" onchange="convert()"></select></div>
                <div class="equals">=</div>
                <div class="input-group"><label>To</label><input type="number" id="toValue" readonly><select id="toUnit" onchange="convert()"></select></div>
            </div>
            <div class="result-box"><div class="result-value" id="resultText">1 meter = 3.28084 feet</div></div>
        </div>
    </main>
    <footer class="site-footer"><div class="container"><p>&copy; 2026 Pixaroid</p><div class="footer-links"><a href="/privacy-policy.html">Privacy</a><a href="/terms-of-service.html">Terms</a></div></div></footer>
    <script>
        const units = {
            length: { meters: 1, kilometers: 0.001, centimeters: 100, millimeters: 1000, miles: 0.000621371, yards: 1.09361, feet: 3.28334, inches: 39.3701 },
            weight: { kilograms: 1, grams: 1000, milligrams: 1000000, pounds: 2.20462, ounces: 35.274, tons: 0.001 },
            temperature: { celsius: 'C', fahrenheit: 'F', kelvin: 'K' },
            volume: { liters: 1, milliliters: 1000, gallons: 0.264172, quarts: 1.05669, pints: 2.11338, cups: 4.22675 },
            area: { squareMeters: 1, squareKilometers: 0.000001, squareFeet: 10.7639, squareYards: 1.19599, acres: 0.000247105, hectares: 0.0001 }
        };
        let currentCategory = 'length';
        
        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            populateUnits();
            convert();
        }
        
        function populateUnits() {
            const fromSel = document.getElementById('fromUnit');
            const toSel = document.getElementById('toUnit');
            const unitList = Object.keys(units[currentCategory]);
            fromSel.innerHTML = unitList.map(u => `<option value="${u}">${u}</option>`).join('');
            toSel.innerHTML = unitList.map((u, i) => `<option value="${u}" ${i === 1 ? 'selected' : ''}>${u}</option>`).join('');
        }
        
        function convert() {
            const fromVal = parseFloat(document.getElementById('fromValue').value) || 0;
            const fromU = document.getElementById('fromUnit').value;
            const toU = document.getElementById('toUnit').value;
            let result;
            
            if (currentCategory === 'temperature') {
                let celsius;
                if (fromU === 'celsius') celsius = fromVal;
                else if (fromU === 'fahrenheit') celsius = (fromVal - 32) * 5/9;
                else celsius = fromVal - 273.15;
                
                if (toU === 'celsius') result = celsius;
                else if (toU === 'fahrenheit') result = celsius * 9/5 + 32;
                else result = celsius + 273.15;
            } else {
                const base = fromVal / units[currentCategory][fromU];
                result = base * units[currentCategory][toU];
            }
            
            document.getElementById('toValue').value = result.toFixed(6);
            document.getElementById('resultText').textContent = `${fromVal} ${fromU} = ${result.toFixed(6)} ${toU}`;
        }
        
        populateUnits();
        convert();
    </script>
</body>
</html>
