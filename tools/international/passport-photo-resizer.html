    <main class="container">
        <div class="tool-container">
            <h1>📸 Passport Photo Resizer</h1>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p>📁 Click to upload your photo or drag and drop</p>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
            </div>
            <div class="controls">
                <select id="countrySelect" onchange="updateDimensions()">
                    <option value="us">USA (2x2 inches)</option>
                    <option value="uk">UK (35x45 mm)</option>
                    <option value="eu">EU/Schengen (35x45 mm)</option>
                    <option value="in">India (35x45 mm)</option>
                    <option value="cn">China (33x48 mm)</option>
                    <option value="jp">Japan (35x45 mm)</option>
                    <option value="au">Australia (35x45 mm)</option>
                    <option value="custom">Custom</option>
                </select>
                <input type="number" id="widthMM" placeholder="Width mm" value="35" style="width:80px" disabled>
                <input type="number" id="heightMM" placeholder="Height mm" value="45" style="width:80px" disabled>
                <button class="primary" onclick="resizePhoto()">Resize Photo</button>
                <button onclick="downloadPhoto()">⬇️ Download</button>
            </div>
            <div class="preview">
                <div class="preview-box"><h4>Original</h4><canvas id="originalCanvas"></canvas><div class="dimensions" id="origDims"></div></div>

    <script>
        let originalImage = null;
        const dims = { us: [51, 51], uk: [35, 45], eu: [35, 45], in: [35, 45], cn: [33, 48], jp: [35, 45], au: [35, 45] };
        
        function updateDimensions() {
            const country = document.getElementById('countrySelect').value;
            const custom = country === 'custom';
            document.getElementById('widthMM').disabled = !custom;
            document.getElementById('heightMM').disabled = !custom;
            if (!custom && dims[country]) {
                document.getElementById('widthMM').value = dims[country][0];
                document.getElementById('heightMM').value = dims[country][1];
            }
        }
        
        function loadImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                originalImage = new Image();
                originalImage.onload = function() {
                    const origCanvas = document.getElementById('originalCanvas');
                    origCanvas.width = Math.min(300, originalImage.width);
                    origCanvas.height = origCanvas.width * (originalImage.height / originalImage.width);
                    const ctx = origCanvas.getContext('2d');
                    ctx.drawImage(originalImage, 0, 0, origCanvas.width, origCanvas.height);
                    document.getElementById('origDims').textContent = `${originalImage.width} x ${originalImage.height} px`;
                };
                originalImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function resizePhoto() {
            if (!originalImage) { alert('Please upload a photo first'); return; }
            const widthMM = parseFloat(document.getElementById('widthMM').value) || 35;
            const heightMM = parseFloat(document.getElementById('heightMM').value) || 45;
            const dpi = 300;
            const widthPx = Math.round((widthMM / 25.4) * dpi);
            const heightPx = Math.round((heightMM / 25.4) * dpi);
            
            const resizedCanvas = document.getElementById('resizedCanvas');
            resizedCanvas.width = widthPx;
            resizedCanvas.height = heightPx;
            const ctx = resizedCanvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, widthPx, heightPx);
            
            const scale = Math.max(widthPx / originalImage.width, heightPx / originalImage.height);
            const x = (widthPx - originalImage.width * scale) / 2;
            const y = (heightPx - originalImage.height * scale) / 2;
            ctx.drawImage(originalImage, x, y, originalImage.width * scale, originalImage.height * scale);
            
            document.getElementById('resizeDims').textContent = `${widthPx} x ${heightPx} px (${widthMM}x${heightMM}mm)`;
        }
        
        function downloadPhoto() {
            const canvas = document.getElementById('resizedCanvas');
            if (canvas.width === 0) { alert('Please resize a photo first'); return; }
            const link = document.createElement('a');
            link.download = 'passport-photo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
