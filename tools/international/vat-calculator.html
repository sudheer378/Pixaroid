<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAT Calculator - Calculate Value Added Tax | Pixaroid</title>
    <meta name="description" content="Free VAT calculator for EU and international countries. Calculate VAT inclusive and exclusive prices instantly.">
    <meta name="keywords" content="vat calculator, value added tax, tax calculator, eu vat, pixaroid">
    <link rel="canonical" href="https://pixaroid.vercel.app/tools/international/vat-calculator.html">
    <meta property="og:title" content="VAT Calculator">
    <meta property="og:description" content="Calculate VAT for any country instantly.">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .calc-container { max-width: 700px; margin: 40px auto; padding: 30px; background: #1e1e2f; border-radius: 12px; }
        h1 { color: #00d4ff; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #aaa; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; background: #2a2a3e; border: 1px solid #3a3a5a; color: #fff; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        .radio-group { display: flex; gap: 20px; margin: 15px 0; }
        .radio-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        button { width: 100%; padding: 14px; background: #00d4ff; color: #000; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .results { background: #2a2a3e; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .result-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #3a3a5a; }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #aaa; }
        .result-value { color: #00d4ff; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header class="site-header"><nav class="navbar"><div class="container nav-container"><a href="/" class="logo">Pixaroid</a><ul class="nav-menu"><li><a href="/">Home</a></li><li><a href="/tools/">All Tools</a></li></ul></div></nav></header>
    <main class="container">
        <div class="calc-container">
            <h1>💷 VAT Calculator</h1>
            <div class="form-group">
                <label>Country</label>
                <select id="country" onchange="updateRate()">
                    <option value="20">Austria (20%)</option>
                    <option value="21">Belgium (21%)</option>
                    <option value="20">Bulgaria (20%)</option>
                    <option value="25">Croatia (25%)</option>
                    <option value="19">Cyprus (19%)</option>
                    <option value="21">Czech Republic (21%)</option>
                    <option value="25">Denmark (25%)</option>
                    <option value="20">Estonia (20%)</option>
                    <option value="24">Finland (24%)</option>
                    <option value="20">France (20%)</option>
                    <option value="19">Germany (19%)</option>
                    <option value="24">Greece (24%)</option>
                    <option value="27">Hungary (27%)</option>
                    <option value="23">Ireland (23%)</option>
                    <option value="22">Italy (22%)</option>
                    <option value="21">Latvia (21%)</option>
                    <option value="21">Lithuania (21%)</option>
                    <option value="17">Luxembourg (17%)</option>
                    <option value="18">Malta (18%)</option>
                    <option value="21">Netherlands (21%)</option>
                    <option value="23">Poland (23%)</option>
                    <option value="23">Portugal (23%)</option>
                    <option value="19">Romania (19%)</option>
                    <option value="20">Slovakia (20%)</option>
                    <option value="22">Slovenia (22%)</option>
                    <option value="21">Spain (21%)</option>
                    <option value="25">Sweden (25%)</option>
                    <option value="20">United Kingdom (20%)</option>
                    <option value="custom">Custom Rate</option>
                </select>
            </div>
            <div class="form-group" id="customRateGroup" style="display:none;">
                <label>Custom VAT Rate (%)</label>
                <input type="number" id="customRate" value="20" min="0" max="100">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="amount" placeholder="Enter amount" step="0.01">
            </div>
            <div class="radio-group">
                <label><input type="radio" name="vatType" value="exclusive" checked> Amount excludes VAT</label>
                <label><input type="radio" name="vatType" value="inclusive"> Amount includes VAT</label>
            </div>
            <button onclick="calculateVAT()">Calculate VAT</button>
            <div class="results" id="results" style="display:none;">
                <div class="result-row"><span class="result-label">Net Amount:</span><span class="result-value" id="netAmount"></span></div>
                <div class="result-row"><span class="result-label">VAT Amount:</span><span class="result-value" id="vatAmount"></span></div>
                <div class="result-row"><span class="result-label">Gross Amount:</span><span class="result-value" id="grossAmount"></span></div>
            </div>
        </div>
    </main>
    <footer class="site-footer"><div class="container"><p>&copy; 2026 Pixaroid</p><div class="footer-links"><a href="/privacy-policy.html">Privacy</a><a href="/terms-of-service.html">Terms</a></div></div></footer>
    <script>
        function updateRate() {
            const country = document.getElementById('country').value;
            document.getElementById('customRateGroup').style.display = country === 'custom' ? 'block' : 'none';
        }
        
        function calculateVAT() {
            const amount = parseFloat(document.getElementById('amount').value);
            if (isNaN(amount) || amount <= 0) { alert('Please enter a valid amount'); return; }
            
            let rate = parseFloat(document.getElementById('country').value);
            if (document.getElementById('country').value === 'custom') {
                rate = parseFloat(document.getElementById('customRate').value) || 20;
            }
            
            const isExclusive = document.querySelector('input[name="vatType"][value="exclusive"]').checked;
            let net, vat, gross;
            
            if (isExclusive) {
                net = amount;
                vat = amount * (rate / 100);
                gross = net + vat;
            } else {
                gross = amount;
                net = amount / (1 + rate / 100);
                vat = gross - net;
            }
            
            document.getElementById('netAmount').textContent = '€' + net.toFixed(2);
            document.getElementById('vatAmount').textContent = '€' + vat.toFixed(2) + ' (' + rate + '%)';
            document.getElementById('grossAmount').textContent = '€' + gross.toFixed(2);
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
