<body><div class="wrap"><a href="/tools/international/">← International Tools</a><h1>Text Translator</h1><p class="muted">Live translation requires a configured translation provider. This page never pretends that a demo result is a real translation.</p><div class="card"><div class="row"><div class="col"><label>From<select id="source"><option value="auto">Detect language</option><option>English</option><option>Hindi</option><option>Spanish</option><option>French</option><option>German</option><option>Arabic</option><option>Japanese</option><option>Chinese</option></select></label><textarea id="input" rows="10" placeholder="Enter text to translate"></textarea><button id="translate">Translate</button></div><div class="col"><label>To<select id="target"><option>English</option><option>Hindi</option><option>Spanish</option><option>French</option><option>German</option><option>Arabic</option><option>Japanese</option><option>Chinese</option></select></label><textarea id="output" rows="10" readonly placeholder="Translation will appear here"></textarea><button id="copy">Copy translation</button></div></div><p id="status" class="muted"></p></div></div>
<script>const input=document.getElementById('input'),output=document.getElementById('output'),status=document.getElementById('status');document.getElementById('translate').onclick=()=>{if(!input.value.trim()){status.textContent='Enter text first.';return}status.className='error';status.textContent='Live translation is not configured. Configure a translation API backend before publishing production translations.';output.value=''};document.getElementById('copy').onclick=async()=>{if(!output.value)return;try{await navigator.clipboard.writeText(output.value);status.className='muted';status.textContent='Copied.'}catch{status.textContent='Copy failed.'}};</script>
