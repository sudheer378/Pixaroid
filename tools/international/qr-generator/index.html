<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code Generator - Create Custom QR Codes | Pixaroid</title>
<meta name="description" content="Generate custom QR codes for URLs, text, WiFi, and more. Free browser-based QR code generator with download option.">
<link rel="canonical" href="https://pixaroid.vercel.app/tools/international/qr-generator/">
<meta name="robots" content="index, follow">
<style>
    body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #f8fafc;
        min-height: 100vh;
        padding: 20px;
    }
    .container {
        max-width: 900px;
        margin: auto;
    }
    .back {
        display: inline-block;
        margin-bottom: 20px;
        color: #a5b4fc;
        text-decoration: none;
    }
    .back:hover {
        text-decoration: underline;
    }
    h1 {
        font-size: 2rem;
        margin-bottom: 10px;
    }
    .tool-desc {
        color: #94a3b8;
        margin-bottom: 30px;
    }
    .generator-card {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 30px;
        margin-bottom: 30px;
    }
    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }
    .tab-btn {
        padding: 10px 20px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: rgba(15, 23, 42, 0.6);
        color: #94a3b8;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .tab-btn.active {
        background: #6366f1;
        border-color: #6366f1;
        color: #fff;
    }
    .tab-btn:hover:not(.active) {
        border-color: #6366f1;
        color: #e2e8f0;
    }
    .input-group {
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #e2e8f0;
    }
    input[type="text"], input[type="url"], textarea, select {
        width: 100%;
        padding: 14px 16px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #1e293b;
        color: #f8fafc;
        font-size: 1rem;
        box-sizing: border-box;
        font-family: inherit;
    }
    textarea {
        min-height: 120px;
        resize: vertical;
    }
    .color-picker-group {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }
    .color-item {
        flex: 1;
        min-width: 150px;
    }
    input[type="color"] {
        width: 100%;
        height: 50px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: transparent;
    }
    button.generate-btn {
        width: 100%;
        padding: 16px 20px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: #fff;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    button.generate-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
    }
    .result-section {
        display: none;
        text-align: center;
        margin-top: 30px;
        padding: 25px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid #334155;
        border-radius: 16px;
    }
    .result-section.active {
        display: block;
    }
    #qrCanvas {
        max-width: 100%;
        height: auto;
        margin-bottom: 20px;
    }
    .download-btn {
        display: inline-block;
        padding: 12px 30px;
        border-radius: 8px;
        background: #10b981;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.3s ease;
    }
    .download-btn:hover {
        background: #059669;
    }
    .hidden {
        display: none;
    }
</style>
</head>
<body>
<div class="container">
    <a class="back" href="/tools/international/">← Back to International Tools</a>
    
    <header>
        <h1>📱 QR Code Generator</h1>
        <p class="tool-desc">Create custom QR codes for URLs, text, WiFi networks, and more. Download instantly!</p>
    </header>

    <div class="generator-card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('url')">🔗 URL</button>
            <button class="tab-btn" onclick="switchTab('text')">📝 Text</button>
            <button class="tab-btn" onclick="switchTab('wifi')">📶 WiFi</button>
            <button class="tab-btn" onclick="switchTab('email')">📧 Email</button>
        </div>

        <div id="urlInput" class="input-section">
            <div class="input-group">
                <label for="urlText">Enter URL:</label>
                <input type="url" id="urlText" placeholder="https://example.com">
            </div>
        </div>

        <div id="textInput" class="input-section hidden">
            <div class="input-group">
                <label for="plainText">Enter Text:</label>
                <textarea id="plainText" placeholder="Enter your text here..."></textarea>
            </div>
        </div>

        <div id="wifiInput" class="input-section hidden">
            <div class="input-group">
                <label for="wifiSSID">Network Name (SSID):</label>
                <input type="text" id="wifiSSID" placeholder="MyWiFiNetwork">
            </div>
            <div class="input-group">
                <label for="wifiPassword">Password:</label>
                <input type="text" id="wifiPassword" placeholder="Your password">
            </div>
            <div class="input-group">
                <label for="wifiEncryption">Encryption:</label>
                <select id="wifiEncryption">
                    <option value="WPA">WPA/WPA2</option>
                    <option value="WEP">WEP</option>
                    <option value="nopass">No Password</option>
                </select>
            </div>
        </div>

        <div id="emailInput" class="input-section hidden">
            <div class="input-group">
                <label for="emailTo">Email Address:</label>
                <input type="text" id="emailTo" placeholder="recipient@example.com">
            </div>
            <div class="input-group">
                <label for="emailSubject">Subject:</label>
                <input type="text" id="emailSubject" placeholder="Email subject">
            </div>
            <div class="input-group">
                <label for="emailBody">Message:</label>
                <textarea id="emailBody" placeholder="Email body text..."></textarea>
            </div>
        </div>

        <div class="input-group">
            <label>Customize Colors:</label>
            <div class="color-picker-group">
                <div class="color-item">
                    <label for="fgColor" style="font-size: 0.9rem;">Foreground Color</label>
                    <input type="color" id="fgColor" value="#000000">
                </div>
                <div class="color-item">
                    <label for="bgColor" style="font-size: 0.9rem;">Background Color</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
            </div>
        </div>

        <button class="generate-btn" onclick="generateQR()">Generate QR Code</button>

        <div class="result-section" id="resultSection">
            <canvas id="qrCanvas"></canvas>
            <br>
            <a class="download-btn" onclick="downloadQR()">⬇️ Download PNG</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
    let currentTab = 'url';

    function switchTab(tab) {
        currentTab = tab;
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        document.querySelectorAll('.input-section').forEach(section => section.classList.add('hidden'));
        document.getElementById(tab + 'Input').classList.remove('hidden');
        
        document.getElementById('resultSection').classList.remove('active');
    }

    function generateQR() {
        let data = '';
        
        switch(currentTab) {
            case 'url':
                data = document.getElementById('urlText').value.trim();
                if (!data) {
                    alert('Please enter a URL!');
                    return;
                }
                break;
                
            case 'text':
                data = document.getElementById('plainText').value.trim();
                if (!data) {
                    alert('Please enter some text!');
                    return;
                }
                break;
                
            case 'wifi':
                const ssid = document.getElementById('wifiSSID').value.trim();
                const password = document.getElementById('wifiPassword').value;
                const encryption = document.getElementById('wifiEncryption').value;
                
                if (!ssid) {
                    alert('Please enter network name!');
                    return;
                }
                
                data = `WIFI:T:${encryption};S:${ssid};P:${password};;`;
                break;
                
            case 'email':
                const emailTo = document.getElementById('emailTo').value.trim();
                const emailSubject = document.getElementById('emailSubject').value.trim();
                const emailBody = document.getElementById('emailBody').value.trim();
                
                if (!emailTo) {
                    alert('Please enter an email address!');
                    return;
                }
                
                data = `mailto:${emailTo}?subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(emailBody)}`;
                break;
        }

        const fgColor = document.getElementById('fgColor').value;
        const bgColor = document.getElementById('bgColor').value;
        
        const canvas = document.getElementById('qrCanvas');
        
        QRCode.toCanvas(canvas, data, {
            width: 400,
            margin: 2,
            color: {
                dark: fgColor,
                light: bgColor
            }
        }, function(error) {
            if (error) {
                console.error(error);
                alert('Error generating QR code. Please try again.');
                return;
            }
            document.getElementById('resultSection').classList.add('active');
        });
    }

    function downloadQR() {
        const canvas = document.getElementById('qrCanvas');
        const link = document.createElement('a');
        link.download = 'qrcode.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

<script type="module" src="/js/modules/monetization.js" data-pixaroid-monetization></script>
</body>
</html>
